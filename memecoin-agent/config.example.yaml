# Copy to config.yaml and adjust. Every key is optional; omitted keys use the defaults
# in memecoin_agent/config.py. Unknown keys are rejected so typos can't silently no-op.

filters:
  quote_symbols: [SOL, USDC]
  min_liquidity_usd: 12000
  min_market_cap_usd: 150000 # low caps are the copy lane's (copy:): bought only when tracked wallets buy them
  max_market_cap_usd: 5000000
  min_age_minutes: 15        # most Solana rugs happen in the first hour; under 60 min needs the wallet scan
  max_age_hours: 72
  min_volume_h1_usd: 10000
  min_txns_h1: 80
  min_buy_sell_ratio_h1: 1.15
  min_buy_sell_ratio_m5: 1.0
  min_price_change_m5: 0.0
  min_price_change_h1: 5.0
  max_price_change_h1: 250.0 # don't chase vertical candles
  min_volume_to_liquidity_h1: 0.3
  min_score: 0.55
  require_rugcheck: true     # fails closed if RugCheck is unreachable
  # Early or small buys must also pass the wallet scan (bundles, linked wallets, top holders, creator;
  # limits under launch:). 0 turns either trigger off.
  wallet_scan_below_age_minutes: 60
  wallet_scan_below_market_cap_usd: 50000
  # Copy and long-term buys wait while the price is down this much over 5 minutes (a market buy into a
  # falling knife fills far below the quote); manual buys get a warning. null = off.
  max_drop_m5_pct: 10
  max_rugcheck_score: 50
  reject_danger_risks: true  # mint/freeze authority, unlocked LP, whale concentration...
  blacklist: []
  watchlist: []              # mints to evaluate every scan in addition to discovery

exits:
  style: let_it_run           # or classic (stop_loss_pct, take_profit_levels, trailing stop below)
  hard_stop_pct: 30           # sell everything at -30%, every tick
  secure_at_pct: 25           # up 25%: sell the initial cost + secure_profit_share of the profit...
  secure_profit_share: 0.5
  secure_sell_fraction: null  # ...or a fixed share of the position instead of that formula
  # ...the rest (the runner) is sold this far below its peak, by how far that peak is above entry:
  runner_trail:
    - {above_pct: 0, drawdown_pct: 30}
    - {above_pct: 100, drawdown_pct: 40}
    - {above_pct: 300, drawdown_pct: 50}
  runner_drawdown_pct: 70     # used only when runner_trail is empty
  runner_review_minutes: 0    # 0: checked every tick
  runner_take_at_pct: 100     # up 100%: sell runner_take_fraction of the runner once (null = off)
  runner_take_fraction: 0.5
  runner_floor_pct: null      # e.g. 0: sell the runner if it comes back to its entry price
  stall_minutes: 30           # held this long without ever being up stall_min_peak_pct: sold (null = off)
  stall_min_peak_pct: 5
  protect_after_pct: null     # e.g. 15: was up 15% and is back at protect_floor_pct: sold near break-even
  protect_floor_pct: 1
  dip_watch_pct: null         # e.g. 30 with hard_stop_pct: 50: 30-minute dip reviews instead of a tight stop
  dip_hold_max_pct: 40
  dip_review_minutes: 30
  consolidation_max_range_pct: 25
  consolidation_max_slide_pct: 10
  lp_removed_exit_pct: 25     # liquidity leaving the pool beyond what the price move explains: sell
  lanes: {}                   # per-lane overrides, e.g. {lowcap: {hard_stop_pct: 30}}
  max_hold_minutes: 720       # time stop for positions whose initials never came out (runners: none)
  liquidity_drop_exit_pct: 40
  # classic only:
  stop_loss_pct: 25
  take_profit_levels:
    - {at_pct: 50, sell_fraction: 0.4}
    - {at_pct: 120, sell_fraction: 0.5}
  trailing_activation_pct: 30
  trailing_stop_pct: 20

risk:
  starting_balance_usd: 1000 # paper mode only; live mode reads your wallet
  position_size_pct: 5
  max_position_usd: 100
  min_position_usd: 10
  max_open_positions: 20      # runners, long-term holds, manual trades and dust don't count
  max_daily_loss_pct: 15
  max_daily_loss_usd: null          # e.g. 500: a fixed dollar limit instead of the percentage
  token_cooldown_minutes: 180
  max_entries_per_hour: 6
  conviction_sizing: true     # size by score: conviction_floor of the usual size at the lane's minimum score
  conviction_floor: 0.6
  conviction_full_score: 0.75

regime:                       # no new automatic entries while the market itself is falling
  enabled: true
  min_breadth: 0.25           # share of scanned coins that are up over the last hour (null = off)
  min_coins: 30               # fewer coins in a scan: breadth isn't judged
  max_sol_drop_h1_pct: 4      # SOL down this much in an hour (null = off)
  window_minutes: 15

learning:                     # track record from the scan log (agent.scan_log_file)
  enabled: true
  min_lane_samples: 30        # finished rows that passed the same lane before it has an opinion
  min_band_samples: 100       # else: rows of the same size, age and buy pressure
  max_rug_rate: 0.5           # skip a group in which more than half rugged (null = off)
  min_avg_ret_1h: -20         # skip a group that averaged below -20% after an hour (null = off)
  min_size_factor: 0.6        # position size scales between these with the group's average 1h return
  max_size_factor: 1.25

execution:
  mode: paper                # paper | live  (live also needs MEMECOIN_AGENT_CONFIRM_LIVE=yes)
  slippage_bps: 300
  paper_fee_pct: 0.5
  paper_price_impact: true
  # Seconds before a real order would land: paper fills move against you by the coin's 5-minute move
  # scaled to this delay, so fast movers cost on paper what they would live. 0 = off.
  paper_latency_s: 6
  # Use a private RPC (Helius, Triton, QuickNode...) for live trading; the public one is rate-limited.
  rpc_url: https://api.mainnet-beta.solana.com
  jupiter_base_url: https://lite-api.jup.ag/swap/v1
  # jupiter_api_key: ...     # if you use the keyed api.jup.ag endpoint
  priority_fee_max_lamports: 500000
  min_sol_reserve: 0.05
  confirm_timeout_s: 60
  max_roundtrip_loss_pct: 12

agent:
  scan_log: true                   # log every scanned coin and what it did 15m / 1h / 4h later (state/scans.csv)
  scan_log_file: state/scans.csv   # read it with `memecoin-agent scans`
  tick_seconds: 10           # open positions are re-priced and exits checked every tick
  scan_every_ticks: 2        # discovery scan every 20s (tick_seconds x scan_every_ticks)
  max_candidates_per_scan: 150  # 30 mints per DexScreener request
  state_file: state/state.json
  trades_csv: state/trades.csv
  log_file: state/agent.log
  kill_switch_file: STOP     # `touch STOP` to halt new entries; exits keep running

feeds:
  # PumpPortal websocket (free, no key). Graduations = pump.fun tokens that just got a
  # real AMM pool; they go to the front of discovery the moment they happen.
  pumpportal_migrations: true
  # Every new pump.fun token (thousands a day, mostly bonding-curve). Only useful with
  # much looser liquidity/age filters and a lower evict_below_liquidity_usd.
  pumpportal_new_tokens: false
  pumpportal_url: wss://pumpportal.fun/api/data
  evict_below_liquidity_usd: 5000  # drop dead pools (30+ min after the event) from the scan budget
  max_buffered_mints: 2000
  buffer_file: state/feed.json     # survives restarts

recorder:
  dir: recordings
  interval_s: 30
  discover_every_ticks: 2
  track_hours: 12          # keep sampling each discovered token this long
  max_tracked: 400         # ~100-150 MB/day of gzipped data at this size
  record_safety: true      # store RugCheck verdicts so backtests can apply them
  record_while_trading: false  # true = `run`/`ui` also record (same as --record)

larpcheck:
  # LarpCheck (larpcheck.app) verdicts as the last gate before a buy, after the filters and
  # RugCheck. Key: LARPCHECK_API_KEY env var, or this file. Looking up verdicts is free.
  enabled: true
  api_key_file: ~/.config/larpcheck/api_key
  reject_verdicts: [LARP, LIKELY LARP, SCAM]
  reject_coin_stamps: [RIGGED]    # stamps: OK / NEUTRAL / SKETCHY / RIGGED
  min_coin_score: null
  require_verdict: true           # never buy a coin LarpCheck hasn't checked (no credits / down / no key = no buy)
  on_unchecked: check             # check (spends a daily credit, buys only if it passes) | reject | allow (needs require_verdict: false)
  max_checks_per_day: 4           # free plan: 5 credits a day
  pending_max_minutes: 5
  fail_closed: false              # only used with require_verdict: false (LarpCheck down: other checks decide)
  # Held coins: re-read the verdict every few minutes (free). When LarpCheck flags one, read its
  # reasoning and sell. Only a LIKELY LARP / LIKELY REAL coin stamped OK, never RIGGED in any check,
  # sells 80% and keeps 20% as dust; everything else LarpCheck flags sells in full.
  exit_on_flag: true
  exit_verdicts: [LIKELY LARP, LARP, SCAM]
  exit_coin_stamps: [RIGGED]
  dust_verdicts: [LIKELY LARP, LIKELY REAL]
  dust_coin_stamps: [OK]
  exit_sell_fraction: 0.8
  sell_on_change: true            # a LIKELY coin whose LarpCheck view changes (new check/verdict/stamp) sells too
  held_recheck_minutes: 5
  max_report_opens_per_day: 1     # opening someone else's full report costs a credit (free plan)
  # Memes (see classify): lookup = LarpCheck's free lookup only (a bad verdict still blocks; nothing is
  # required, started or opened, so no credits); full = the tech rules; off = no LarpCheck for memes.
  memes: lookup

classify:
  # Tech (launchpads, AI agents, apps, protocols, labs...) or meme, from the token's name, description
  # and links. Tech gets the full LarpCheck gate. Any product signal counts as tech.
  enabled: true
  extra_tech_words: []              # e.g. [oracle, rpc]

authenticity:
  # Fake-chart check on every candidate, free, before any paid check. Measured on live tokens: real
  # active coins stayed under ~20x liquidity an hour and ~$400 volume per holder; wash-traded ones
  # ran 50-200x and $1,000-8,000.
  enabled: true
  max_turnover_per_hour: 50         # 24h volume / liquidity, per hour of the pool's life (1-24h)
  max_volume_per_holder_usd: 1500
  max_trades_per_holder_h1: 8
  min_holders: 100
  reject_holder_correlation: true   # RugCheck's "High holder correlation": wallets moving together
  min_avg_trade_usd: 12             # bot spam: real coins averaged $17+ a trade, bot-run ones $1-6 (last hour, 200+ trades)
  max_price_change_h6: 500          # already ran: skip coins up more than this in 6h (null = off)
  min_volume_to_mcap_h1: 0.02       # painted chart: under a day old, rising, an hour's volume under 2% of market cap
  max_drawdown_from_high_pct: 50    # just dumped: more than this below the high the agent saw in the last 2h
  reject_honeypot_mint: true        # live mint/freeze authority, permanent delegate, transfer hook, pausable, frozen accounts
  max_transfer_fee_pct: 5

honeypot:
  # Before each paper buy: quote the buy on Jupiter, then quote selling it straight back (quotes only, no
  # wallet). No sell route, or losing more than execution.max_roundtrip_loss_pct, means no buy.
  sell_route_check: true
  fail_closed: true                 # Jupiter unreachable: skip the buy

gmgn:
  # GMGN OpenAPI (gmgn.ai): extra discovery (trending) and a pre-buy safety check. Read-only data
  # endpoints only; nothing here trades. Key: GMGN_API_KEY env var, or the .env file that
  # `gmgn-cli config --apply` writes. Without a key the agent runs without GMGN.
  enabled: true
  api_key_file: ~/.config/gmgn/.env
  discovery: true
  discovery_chains: [sol, bsc, base, eth, arbitrum, polygon, optimism, avalanche, monad, robinhood, hyperevm, tron]
  trending_interval: 1h            # 1m / 5m / 1h / 6h / 24h
  trending_limit: 100
  trending_order_by: volume
  trending_filters: [renounced, frozen, not_wash_trading]
  discover_every_s: 120
  safety: true                     # runs after RugCheck, before LarpCheck (no credits spent on GMGN rejects)
  max_rug_ratio: 0.3
  reject_wash_trading: true
  max_top10_holder_rate: 0.35
  max_dev_team_hold_rate: 0.10
  max_creator_hold_rate: 0.10
  max_insider_hold_rate: 0.15
  max_bundler_rate: 0.30
  max_rat_trader_rate: 0.30
  max_sell_tax: 0.10
  max_fresh_wallet_rate: null      # e.g. 0.5 to skip coins held mostly by brand-new wallets
  max_creator_launches: null       # e.g. 20 to skip serial deployers
  min_smart_wallets: 0             # e.g. 1 to require at least one smart-money holder
  # GMGN's own pre-buy checklist: soft warnings, each tolerable alone; more than max_warnings refuses
  # the buy (GMGN refuses at two). null = off.
  max_warnings: 1
  warn_top10_holder_rate: 0.50
  warn_creator_hold_rate: 0.05
  warn_rat_trader_rate: 0.15       # insider traders' share of volume
  warn_entrapment_rate: 0.30       # entrapment traders' share of volume
  warn_bot_degen_rate: 0.60
  warn_bundler_wallet_share: 0.05  # bundler wallets / holders
  warn_fresh_wallet_rate: 0.30
  warn_min_holders: 200
  fail_closed: false               # GMGN down / rate limited: false = the other checks decide
  rate_per_s: 5                    # your plan's rate (free 5, Plus 20, Pro 50), shared by every GMGN user here

narrative:
  # NewsCheck (newscheck.app): the story behind each coin. Needs a free key: NEWSCHECK_API_KEY or the file below.
  # A young, small coin whose rundown shows a strong story (viral post, meta, product, KOL push...) is bought
  # early, past the momentum filters; a coin rated RED FLAG / DEV EXIT / LARP is never bought.
  enabled: true
  api_key_file: ~/.config/newscheck/api_key
  max_new_checks_per_day: 0        # paid plans only: request checks for the best young coins that have no rundown (0 = never)
  require_rundown: false           # true: buy nothing NewsCheck hasn't covered
  min_confidence: 50
  min_legit_score: 35              # under this, a coin is blocked
  min_age_minutes: 3               # the early-entry filters (looser than `filters:`)
  max_age_minutes: 120
  min_liquidity_usd: 8000
  min_market_cap_usd: 10000
  max_market_cap_usd: 400000
  min_txns_h1: 30

jupiter:
  # Pre-buy check on Jupiter's free token data (Solana, no key). Runs after RugCheck, before GMGN.
  enabled: true
  max_dev_mints: 1000              # creator's coin count: most real devs launch 1-5; null = off
  factory_max_holders: 2000        # ...but only for coins under this many holders (some factory coins find a real crowd)
  # Organic score (0-100, Jupiter's share of real trading), judged only on coins this old and busy:
  # Jupiter leaves fresh coins at 0 until it has scored them.
  min_organic_score: 20            # null = off
  organic_min_age_hours: 1          # live: 4 of 4 unscored coins past an hour fell 33-100% within 20 min
  organic_min_volume_1h_usd: 20000
  shell_min_market_cap_usd: 1000000  # a market cap this big held by fewer than shell_max_holders: a shell
  shell_max_holders: 100
  wash_max_holders: 150            # 24h volume far past what the pool explains, among fewer holders: wash

launch:
  # Launch lane: a token whose pool traded $400k+ within its first 30 minutes is bought without the
  # momentum filters above, once a wallet scan clears it. RugCheck, GMGN and LarpCheck still apply.
  enabled: true
  max_age_minutes: 30
  min_volume_usd: 400000
  min_liquidity_usd: 15000
  min_price_change_m5: -20         # skip a launch that is crashing right now; null = off
  buy_window_minutes: 15           # a qualified launch stays buyable this long while its checks finish
  # Wallet scan: the chain (execution.rpc_url) back to the launch block, plus RugCheck's holder report.
  max_bundle_pct: 30               # bought in the launch block (bundles + creator's buy), or still held by those wallets
  max_cluster_pct: 30              # linked wallets (RugCheck insider networks and insider-flagged holders)
  max_creator_pct: 10
  max_top10_pct: 35                # top 10 holders, pools and lockers left out
  max_signature_pages: 150         # 1,000 transactions a page when walking back to the launch block

lowcap:
  # Controlled post-launch lane below filters.min_market_cap_usd. Solana candidates need the wallet scan;
  # every chain needs its available honeypot/tax and execution checks before a buy.
  enabled: true
  chains: ["*"]  # every DexScreener chain; unsupported chains fail closed without a honeypot verdict
  quote_symbols: [SOL, USDC, USDT, WBNB, BNB, WETH, ETH, BUSD, DAI]
  min_age_minutes: 20
  max_age_minutes: 360
  min_market_cap_usd: 25000
  max_market_cap_usd: 150000
  min_liquidity_usd: 15000
  min_volume_h1_usd: 15000
  min_txns_h1: 100
  min_buy_sell_ratio_h1: 1.10
  min_buy_sell_ratio_m5: 0.95
  min_price_change_m5: -5
  min_price_change_h1: 0
  max_price_change_h1: 150
  min_volume_to_liquidity_h1: 0.50
  min_score: 0.35
  max_position_usd: 25             # hard cap; global hourly/daily risk limits still apply
  max_price_change_m5: 40          # not the top of a 5-minute spike (null = off)
  min_volume_m5_share: 0.03        # the last 5 minutes carry 3%+ of the hour's volume (null = off)
  confirm_seconds: 30              # bought only if it still qualifies this much later (0 = at once)
  confirm_max_slip_pct: 8

telegram:
  # Alerts, trade downloads (/csv) and remote control from your phone. On when a bot token is set:
  # TELEGRAM_BOT_TOKEN env var, or this file. Only the chats below (plus TELEGRAM_CHAT_ID,
  # comma-separated) can use the bot; anyone else who messages it is told their chat id, nothing more.
  enabled: true
  token_file: ~/.config/memecoin-agent/telegram_token
  allowed_chat_ids: []
  notify_trades: true              # a message for every buy and sell
  allow_controls: true             # /pause /resume /scan /close /closeall /buy /sell /agent (false = report only)

copy:
  # Copy lane: low caps (under filters.min_market_cap_usd) are bought only when a tracked wallet buys
  # them. Needs a GMGN key. Other chains are paper-only.
  enabled: true
  chains: [sol, bsc, base, eth, robinhood]   # GMGN chain names
  min_win_rate: 0.10            # 30-day win rate between 10% and 30%, inclusive
  max_win_rate: 0.30
  min_wallet_age_days: 60       # first funded over 2 months ago
  min_losing_trades: 3          # has taken real losses
  min_trades_30d: 10
  min_pnl: 0.0                  # wins outweigh the losses over 30 days; null = off
  # Copyable at all: a wallet that sells within seconds or trades at bot pace has exited before a copy lands.
  max_trades_30d: 4000          # ~1,000 a week; null = off
  min_avg_hold_s: 60            # 0 = off
  max_fast_flip_rate: 0.30      # share of round trips sold within 5 s (one extra GMGN call per wallet); null = off
  max_wallets_per_chain: 15
  refresh_hours: 6
  wallets: []                   # always tracked, e.g. ["sol:WalletAddr", "base:0x..."]
  min_market_cap_usd: 5000
  min_liquidity_usd: 5000
  min_wallet_buy_usd: 50        # the tracked wallet's own buy; transfers in and its own launches never count
  max_signal_age_minutes: 10
  min_wallets: 1                # e.g. 2: buy only when two tracked wallets bought it
  position_usd: null            # null: the usual risk sizing
  fail_closed: true             # no honeypot check on that chain: skip

longterm:
  # Long-term lane: over a year old, worn down gradually, still traded daily, big holders still in.
  enabled: true
  chains: [solana, ethereum, bsc, base, robinhood]   # DexScreener chain ids (discovery needs a GMGN key)
  watchlist:                    # "chain:address"; these skip the age rule
    - robinhood:0xded852de9fe9ba9b6f27f39e8e81cf851a5c79cc   # ROBINCAT
    - robinhood:0xa934ba4f59070149d37a93f8a002af79bae35563   # PFWA
    - robinhood:0x385f4f8ae47651ce5f58f5265395a669f8281e18   # MEME
  discovery: true
  rescan_hours: 6
  min_age_days: 365
  min_liquidity_usd: 20000
  min_market_cap_usd: 50000
  max_market_cap_usd: 10000000
  min_volume_h24_usd: 2000
  min_buys_h24: 25
  min_active_days: 25           # of the last 30
  min_drawdown_from_high_pct: 60
  max_daily_drop_pct: 40        # last month
  max_drop_7d_pct: 35
  min_holders: 300
  min_large_holders: 5
  large_holder_usd: 1000
  position_usd: 50
  max_positions: 5              # its own slots, outside risk.max_open_positions
  hard_stop_pct: 50
  secure_at_pct: 100            # initials + half the profit out at 2x; the rest runs

