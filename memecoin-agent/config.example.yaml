# Copy to config.yaml and adjust. Every key is optional; omitted keys use the defaults
# in memecoin_agent/config.py. Unknown keys are rejected so typos can't silently no-op.

filters:
  quote_symbols: [SOL, USDC]
  min_liquidity_usd: 25000
  min_market_cap_usd: 50000
  max_market_cap_usd: 5000000
  min_age_minutes: 20        # skip the first-minutes sniper/bundle chaos
  max_age_hours: 72
  min_volume_h1_usd: 20000
  min_txns_h1: 150
  min_buy_sell_ratio_h1: 1.15
  min_buy_sell_ratio_m5: 1.0
  min_price_change_m5: 0.0
  min_price_change_h1: 5.0
  max_price_change_h1: 250.0 # don't chase vertical candles
  min_volume_to_liquidity_h1: 0.3
  min_score: 0.55
  require_rugcheck: true     # fails closed if RugCheck is unreachable
  max_rugcheck_score: 50
  reject_danger_risks: true  # mint/freeze authority, unlocked LP, whale concentration...
  blacklist: []
  watchlist: []              # mints to evaluate every scan in addition to discovery

exits:
  stop_loss_pct: 25
  take_profit_levels:
    - {at_pct: 50, sell_fraction: 0.4}
    - {at_pct: 120, sell_fraction: 0.5}
  trailing_activation_pct: 30
  trailing_stop_pct: 20
  max_hold_minutes: 240
  liquidity_drop_exit_pct: 40

risk:
  starting_balance_usd: 1000 # paper mode only; live mode reads your wallet
  position_size_pct: 5
  max_position_usd: 100
  min_position_usd: 10
  max_open_positions: 5
  max_daily_loss_pct: 15
  token_cooldown_minutes: 180
  max_entries_per_hour: 6

execution:
  mode: paper                # paper | live  (live also needs MEMECOIN_AGENT_CONFIRM_LIVE=yes)
  slippage_bps: 300
  paper_fee_pct: 0.5
  paper_price_impact: true
  # Use a private RPC (Helius, Triton, QuickNode...) for live trading; the public one is rate-limited.
  rpc_url: https://api.mainnet-beta.solana.com
  jupiter_base_url: https://lite-api.jup.ag/swap/v1
  # jupiter_api_key: ...     # if you use the keyed api.jup.ag endpoint
  priority_fee_max_lamports: 500000
  min_sol_reserve: 0.05
  confirm_timeout_s: 60
  max_roundtrip_loss_pct: 12

agent:
  tick_seconds: 10           # open positions are re-priced and exits checked every tick
  scan_every_ticks: 2        # discovery scan every 20s (tick_seconds x scan_every_ticks)
  max_candidates_per_scan: 150  # 30 mints per DexScreener request
  state_file: state/state.json
  trades_csv: state/trades.csv
  log_file: state/agent.log
  kill_switch_file: STOP     # `touch STOP` to halt new entries; exits keep running

feeds:
  # PumpPortal websocket (free, no key). Graduations = pump.fun tokens that just got a
  # real AMM pool; they go to the front of discovery the moment they happen.
  pumpportal_migrations: true
  # Every new pump.fun token (thousands a day, mostly bonding-curve). Only useful with
  # much looser liquidity/age filters and a lower evict_below_liquidity_usd.
  pumpportal_new_tokens: false
  pumpportal_url: wss://pumpportal.fun/api/data
  evict_below_liquidity_usd: 5000  # drop dead pools (30+ min after the event) from the scan budget
  max_buffered_mints: 2000
  buffer_file: state/feed.json     # survives restarts

recorder:
  dir: recordings
  interval_s: 30
  discover_every_ticks: 2
  track_hours: 12          # keep sampling each discovered token this long
  max_tracked: 400         # ~100-150 MB/day of gzipped data at this size
  record_safety: true      # store RugCheck verdicts so backtests can apply them
  record_while_trading: false  # true = `run`/`ui` also record (same as --record)

larpcheck:
  # LarpCheck (larpcheck.app) verdicts as the last gate before a buy, after the filters and
  # RugCheck. Key: LARPCHECK_API_KEY env var, or this file. Looking up verdicts is free.
  enabled: true
  api_key_file: ~/.config/larpcheck/api_key
  reject_verdicts: [LARP, LIKELY LARP, SCAM]
  reject_coin_stamps: [RIGGED]    # stamps: OK / NEUTRAL / SKETCHY / RIGGED
  min_coin_score: null
  require_verdict: true           # never buy a coin LarpCheck hasn't checked (no credits / down / no key = no buy)
  on_unchecked: check             # check (spends a daily credit, buys only if it passes) | reject | allow (needs require_verdict: false)
  max_checks_per_day: 4           # free plan: 5 credits a day
  pending_max_minutes: 5
  fail_closed: false              # only used with require_verdict: false (LarpCheck down: other checks decide)
  # Held coins: re-read the verdict every few minutes (free). When LarpCheck flags one, read its
  # reasoning and sell. Only a LIKELY LARP / LIKELY REAL coin stamped OK, never RIGGED in any check,
  # sells 80% and keeps 20% as dust; everything else LarpCheck flags sells in full.
  exit_on_flag: true
  exit_verdicts: [LIKELY LARP, LARP, SCAM]
  exit_coin_stamps: [RIGGED]
  dust_verdicts: [LIKELY LARP, LIKELY REAL]
  dust_coin_stamps: [OK]
  exit_sell_fraction: 0.8
  sell_on_change: true            # a LIKELY coin whose LarpCheck view changes (new check/verdict/stamp) sells too
  held_recheck_minutes: 5
  max_report_opens_per_day: 1     # opening someone else's full report costs a credit (free plan)

gmgn:
  # GMGN OpenAPI (gmgn.ai): extra discovery (trending) and a pre-buy safety check. Read-only data
  # endpoints only; nothing here trades. Key: GMGN_API_KEY env var, or the .env file that
  # `gmgn-cli config --apply` writes. Without a key the agent runs without GMGN.
  enabled: true
  api_key_file: ~/.config/gmgn/.env
  discovery: true
  trending_interval: 1h            # 1m / 5m / 1h / 6h / 24h
  trending_limit: 100
  trending_order_by: volume
  trending_filters: [renounced, frozen, not_wash_trading]
  discover_every_s: 120
  safety: true                     # runs after RugCheck, before LarpCheck (no credits spent on GMGN rejects)
  max_rug_ratio: 0.3
  reject_wash_trading: true
  max_top10_holder_rate: 0.35
  max_dev_team_hold_rate: 0.10
  max_creator_hold_rate: 0.10
  max_insider_hold_rate: 0.15
  max_bundler_rate: 0.30
  max_rat_trader_rate: 0.30
  max_sell_tax: 0.10
  max_fresh_wallet_rate: null      # e.g. 0.5 to skip coins held mostly by brand-new wallets
  max_creator_launches: null       # e.g. 20 to skip serial deployers
  min_smart_wallets: 0             # e.g. 1 to require at least one smart-money holder
  fail_closed: false               # GMGN down / rate limited: false = the other checks decide

export:
  # Trade CSVs for downloading later: each finished period (UTC clock hour) that had trades gets its
  # own file, e.g. exports/trades_2026-10-22_1300-1400_UTC.csv. state/trades.csv stays the full history.
  enabled: true
  dir: exports
  every_minutes: 60                # must divide a day evenly (15, 30, 60, 120, ...)

telegram:
  # Alerts, the hourly CSVs and remote control from your phone. On when a bot token is set:
  # TELEGRAM_BOT_TOKEN env var, or this file. Only the chats below (plus TELEGRAM_CHAT_ID,
  # comma-separated) can use the bot; anyone else who messages it is told their chat id, nothing more.
  enabled: true
  token_file: ~/.config/memecoin-agent/telegram_token
  allowed_chat_ids: []
  notify_trades: true              # a message for every buy and sell
  send_exports: true               # post each hourly trade CSV to the chat
  allow_controls: true             # /pause /resume /scan /close /closeall (false = report only)
