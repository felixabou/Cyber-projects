# Config baked into the Docker image (see Dockerfile). The agent runs in /data, so the relative
# paths below (state/) land on the volume. Anything not set here uses the defaults in
# config.example.yaml; copy settings over from there to change them, then redeploy.
#
# Paper trading only: this setup holds no wallet key.

execution:
  mode: paper

agent:
  state_file: state/state.json
  trades_csv: state/trades.csv
  log_file: null   # the host keeps the console log; a log file on the volume would grow forever
  kill_switch_file: state/STOP

recorder:
  record_while_trading: false   # market recordings take a lot of disk; record on your PC instead

telegram:
  notify_trades: true
  allow_controls: true

longterm:
  watchlist:   # "chain:address"; these skip the one-year age rule
    - robinhood:0xded852de9fe9ba9b6f27f39e8e81cf851a5c79cc   # ROBINCAT
    - robinhood:0xa934ba4f59070149d37a93f8a002af79bae35563   # PFWA
    - robinhood:0x385f4f8ae47651ce5f58f5265395a669f8281e18   # MEME
